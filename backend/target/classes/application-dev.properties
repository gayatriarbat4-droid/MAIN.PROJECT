# ==========================================================
# MediCare Application - Offline / In-Memory H2 Dev Profile
# Activate via: --spring.profiles.active=dev
# ==========================================================

spring.application.name=medicare-backend-dev
server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:60643;databaseName=medicare_db;integratedSecurity=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate Settings ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

# --- JWT Configuration ---
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

logging.level.com.yourorg.appname=INFO
logging.level.org.springframework.security=INFO

# --- Frontend URL for Verification Links ---
app.frontend.url=http://localhost:5173

# --- Mail Server Configuration (Optional: enter your Gmail & 16-char App Password to send real emails) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
