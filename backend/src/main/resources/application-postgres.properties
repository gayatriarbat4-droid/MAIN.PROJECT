# ==========================================================
# MediCare Application - PostgreSQL Production Profile (Render)
# Activated via: SPRING_PROFILES_ACTIVE=postgres
# ==========================================================

spring.application.name=medicare-backend

# --- PostgreSQL Datasource ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/medicare_db}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgres}

# --- JPA / Hibernate Settings for PostgreSQL ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- Flyway Migrations ---
# Disabled on PostgreSQL to prevent MSSQL migration syntax clashes; JPA ddl-auto handles schema creation
spring.flyway.enabled=false

# --- Hikari Connection Pool Tuning ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
