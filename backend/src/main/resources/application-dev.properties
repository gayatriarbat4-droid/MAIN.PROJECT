# ==========================================================
# MediCare Application - Offline / In-Memory H2 Dev Profile
# Activate via: --spring.profiles.active=dev
# ==========================================================

spring.application.name=medicare-backend-dev
server.port=${PORT:8081}

# --- H2 In-Memory Datasource (PostgreSQL Mode) ---
spring.datasource.url=jdbc:h2:mem:medicare_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false

# --- JWT Configuration ---
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

logging.level.com.yourorg.appname=INFO
logging.level.org.springframework.security=INFO

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}