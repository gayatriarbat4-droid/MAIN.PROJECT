# ==========================================================
# MediCare Hospital Management Application Configuration
# Database: Microsoft SQL Server (MSSQL)
# ==========================================================

spring.application.name=medicare-backend
server.port=${PORT:8081}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# --- Microsoft SQL Server Datasource ---
spring.datasource.url=jdbc:sqlserver://localhost:60643;databaseName=medicare_db;integratedSecurity=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate Settings ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Database Migrations ---
spring.flyway.enabled=false

# --- JWT Configuration ---
# 256-bit secret key in base64 or plaintext
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration: 24 hours (in milliseconds: 86400000)
jwt.expiration-ms=86400000

# --- File / Multipart Uploads ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Logging ---
logging.level.com.yourorg.appname=INFO
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO

# --- Frontend URL for Verification Links ---
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# --- Mail Server Configuration (Optional: enter your Gmail & 16-char App Password to send real emails) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
