# ==========================================================
# MediCare Full-Stack Deployment Blueprint for Render
# Documentation: https://render.com/docs/blueprint-spec
# ==========================================================

databases:
  # 1. Managed PostgreSQL Database (Free Tier)
  - name: medicare-db
    databaseName: medicare_db
    user: medicare_user
    plan: free
    region: oregon

services:
  # 2. Spring Boot 3.3.3 Backend Web Service
  - type: web
    name: medicare-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/hospitals
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://medicare-frontend.onrender.com
      - key: APP_FRONTEND_URL
        value: https://medicare-frontend.onrender.com
      # JWT secret (generates random secure secret on creation)
      - key: JWT_SECRET
        generateValue: true

  # 3. React 18 / Vite 5 Frontend Static Site
  - type: static
    name: medicare-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Single-Page Application (SPA) routing: rewrite all paths to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Automatically wires the backend Web Service host URL into Vite build
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medicare-backend
          property: host
